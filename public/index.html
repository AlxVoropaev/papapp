<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f6ef">
  <title>Видео полка</title>
  <link rel="icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="shell top-inner">
      <div class="brand"><img src="/icon.svg" width="42" height="42" alt=""><span>Видео полка</span></div>
      <div id="library-actions" class="top-actions" hidden></div>
    </div>
  </header>
  <main id="app" class="shell" tabindex="-1"><p class="loading">Открываем полку…</p></main>
  <dialog id="modal" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" class="icon-button" aria-label="Закрыть">×</button></div>
    <div id="dialog-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
